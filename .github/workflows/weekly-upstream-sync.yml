name: Weekly upstream-sync issue

# Mints a fresh `agent-task` issue every week by copying the canonical
# `sync-template` issue. The Autonomous Issue Agent then picks it up and merges
# upstream Gadgetbridge into feat/f91kepler-device via a PR.
#
# NOTE: scheduled workflows only fire from the repo's DEFAULT branch, so this
# file must live on feat/f91kepler-device.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  issues: write

jobs:
  create-sync-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Copy sync-template into a fresh agent-task issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // 1. Dedup guard: if last week's task is still open, don't pile up.
            const openSync = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'upstream-sync', per_page: 100,
            })).filter(i => !i.pull_request);
            if (openSync.length > 0) {
              core.notice(`Open upstream-sync issue #${openSync[0].number} still present; skipping.`);
              return;
            }

            // 2. Find the canonical template issue.
            const template = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'sync-template', per_page: 100,
            })).find(i => !i.pull_request);
            if (!template) {
              core.setFailed("No open issue labeled 'sync-template' found — create one as the weekly template.");
              return;
            }

            // 3. Mint a fresh copy the agent will act on.
            const created = await github.rest.issues.create({
              owner, repo,
              title: template.title,
              body: (template.body || '') +
                `\n\n---\n_Auto-created from template #${template.number} by the weekly upstream-sync workflow._`,
              labels: ['agent-task', 'upstream-sync', 'complex'],
            });
            core.notice(`Created #${created.data.number} from template #${template.number}.`);
