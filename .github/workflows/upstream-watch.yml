name: Watch upstream Gadgetbridge

# Checks daily whether upstream Gadgetbridge (Codeberg) has cut a newer release than
# the version this fork is currently based on. If so it opens an `agent-task` issue
# that the Autonomous Issue Agent picks up and turns into a PR merging upstream into
# feat/f91kepler-device.
#
# The agent only opens the PR — a human reviews/merges it, then tags v<version>-kepler
# to trigger build.yml, which publishes the release. Merges routinely hit conflicts
# (the 0.92.2 sync hit five), so the agent is told to preserve Kepler customizations
# and to bail to a human if conflicts are pervasive.
#
# The issue body lives in .github/agent-sync-task.md ($UPSTREAM/$BASE placeholders,
# expanded with envsubst) so this workflow stays valid YAML.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare fork base against latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API=https://codeberg.org/api/v1/repos/Freeyourgadget/Gadgetbridge

          # Latest upstream release tag (fall back to the newest semver tag).
          UPSTREAM=$(curl -fsSL "$API/releases/latest" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || true)
          if [ -z "$UPSTREAM" ]; then
            UPSTREAM=$(curl -fsSL "$API/tags?limit=50" | python3 -c "import sys,json,re; ts=[t['name'] for t in json.load(sys.stdin) if re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+', t['name'])]; ts.sort(key=lambda v: tuple(int(x) for x in v.split('.'))); print(ts[-1] if ts else '')")
          fi

          # This fork's current upstream base = versionName in app/build.gradle.
          BASE=$(grep -oE 'versionName "[0-9.]+"' app/build.gradle | grep -oE '[0-9.]+' | head -1)

          echo "Upstream latest: '${UPSTREAM:-none}'   Fork base: '${BASE:-none}'"
          if [ -z "$UPSTREAM" ] || [ -z "$BASE" ]; then
            echo "Could not determine one of the versions; skipping."; exit 0
          fi

          NEWER=$(python3 -c "t=lambda v: tuple(int(x) for x in v.split('.')); print('yes' if t('$UPSTREAM')>t('$BASE') else 'no')")
          if [ "$NEWER" != "yes" ]; then
            echo "Fork is up to date with upstream ($BASE >= $UPSTREAM)."; exit 0
          fi

          TITLE="Upstream Gadgetbridge $UPSTREAM released - sync & cut v$UPSTREAM-kepler"

          # Skip if a sync for this version is already in flight. The agent CLOSES the
          # issue the moment it opens the PR, so checking open issues alone would let
          # this re-fire daily and spawn a duplicate PR until the merge lands — hence
          # the open-PR check too. Once merged, versionName == $UPSTREAM and the NEWER
          # guard above stops it for good.
          OPEN_ISSUES=$(gh issue list --state open --search "in:title $UPSTREAM" --json title --jq 'length' || echo 0)
          if [ "${OPEN_ISSUES:-0}" != "0" ]; then
            echo "Tracking issue for $UPSTREAM already open; nothing to do."; exit 0
          fi
          OPEN_PRS=$(gh pr list --state open --search "in:title $UPSTREAM" --json title --jq 'length' || echo 0)
          if [ "${OPEN_PRS:-0}" != "0" ]; then
            echo "Open sync PR for $UPSTREAM already exists; nothing to do."; exit 0
          fi

          BODY=$(UPSTREAM="$UPSTREAM" BASE="$BASE" envsubst '$UPSTREAM $BASE' < .github/agent-sync-task.md)
          gh issue create --label agent-task --label complex --title "$TITLE" --body "$BODY"
          echo "Opened agent-task issue: $TITLE"
